# Lake's configuration, for editors: the Nix flake builds everything without Lake.
#
# Lean's editor support, which the VS Code extension starts as `lake serve` in the directory with
# lean-toolchain, finds the modules that a .lean file imports through the libraries below, and
# builds them in .lake. VS Code does so when it opens the file because .vscode/settings.json
# turns on lean4.automaticallyBuildDependencies. A module that a file imports must be one of a
# library's `roots` or `globs`. As in the Nix builds (`lean -R .`), a module is named after its
# path relative to the library's `srcDir`: experiments/lean-canister/Canister.lean is the module
# `Canister`, which imports `Hello`, experiments/lean-canister/Hello.lean, and candid/Candid/Ty.lean
# is `Candid.Ty`.
#
# lean-toolchain names the upstream nightly that the flake's Lean is built from (see README.md).
# elan, which runs Lean for the VS Code extension, installs that nightly. That is a different
# build from the flake's, which adds cistern's runtime commits, and Lake tells the two apart by
# their git commit (the flake's has none), so the dev shell's `lake` and the editor each rebuild
# what the other built in .lake. The check `lean-files-open` (nix/lean-files-open.nix) fails if
# lean-toolchain names another nightly than the flake's, or if a .lean file has an error when
# opened. Lake writes lake-manifest.json, which lists no dependencies.
name = "cistern"
defaultTargets = ["candid", "lean-canister"]

[[lean_lib]]
name = "candid"
srcDir = "candid"
roots = ["Candid"]
# Candid and every Candid.X, the test programs included.
globs = ["Candid.*"]

[[lean_lib]]
name = "lean-canister"
srcDir = "experiments/lean-canister"
roots = ["Hello", "Ic0", "Probes", "Interface", "Ic", "Canister", "RunProbe", "GenDid"]
